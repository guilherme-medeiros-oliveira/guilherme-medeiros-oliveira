<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Guilherme Medeiros Oliveira: Help Desk N1 e criador do NEXUS</title>
  <desc id="dsc">Banner animado com o nome, o objetivo profissional e um chamado NX-000001 que passa de Aberto para Andamento e Fechado.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#101d44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}

    .t{opacity:0;animation:cyc 14s infinite both}
    .t2{animation-delay:3.5s}
    .t3{animation-delay:7s}
    .t4{animation-delay:10.5s}
    @keyframes cyc{
      0%{opacity:0;transform:translateY(8px)}
      3%,23%{opacity:1;transform:translateY(0)}
      27%,100%{opacity:0;transform:translateY(-8px)}
    }

    .s{opacity:0;animation-duration:9s;animation-iteration-count:infinite;animation-fill-mode:both}
    .s1{animation-name:a1}
    .s2{animation-name:a2}
    .s3{animation-name:a3}
    .ok{animation-name:a4}
    @keyframes a1{0%{opacity:0}6%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes a2{0%,30%{opacity:0}36%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes a3{0%,58%{opacity:0}64%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes a4{0%,64%{opacity:0}70%,92%{opacity:1}97%,100%{opacity:0}}

    @media (prefers-reduced-motion:reduce){
      .t,.s{animation:none!important}
      .t1{opacity:1;transform:none}
      .s{opacity:1}
    }
  </style>

  <!-- Fundo -->
  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="21" fill="none" stroke="#1e3a8a" stroke-opacity="0.7" stroke-width="2"/>

  <!-- Logo N -->
  <g filter="url(#sh)">
    <rect x="48" y="44" width="76" height="76" rx="19" fill="url(#logo)"/>
  </g>
  <text x="86" y="100" text-anchor="middle" class="sans" font-size="52" font-weight="800" fill="#ffffff">N</text>

  <!-- Nome e função -->
  <text x="148" y="64" class="mono" font-size="12" letter-spacing="2.2" fill="#60a5fa">ESTUDANTE DE ANÁLISE E DESENVOLVIMENTO DE SISTEMAS</text>
  <text x="148" y="112" class="sans" font-size="38" font-weight="800" fill="#f8fafc" textLength="520" lengthAdjust="spacingAndGlyphs">Guilherme Medeiros Oliveira</text>

  <!-- Frases que alternam -->
  <text x="148" y="168" class="mono" font-size="20" font-weight="700" fill="#3b82f6">&#8250;</text>
  <g class="mono" font-size="20" fill="#e2e8f0">
    <text class="t t1" x="172" y="168">Em busca da 1ª vaga de Help Desk N1</text>
    <text class="t t2" x="172" y="168">Criador do NEXUS HelpDesk System</text>
    <text class="t t3" x="172" y="168">Sistema de chamados feito do zero</text>
    <text class="t t4" x="172" y="168">Estudando e praticando todos os dias</text>
  </g>
  <rect x="148" y="190" width="500" height="2" rx="1" fill="url(#line)"/>

  <!-- Disponibilidade -->
  <rect x="148" y="208" width="232" height="34" rx="17" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/>
  <circle cx="169" cy="225" r="5" fill="#22c55e"/>
  <circle cx="169" cy="225" r="5" fill="none" stroke="#22c55e">
    <animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="187" y="230" class="sans" font-size="14" font-weight="600" fill="#86efac">Aberto a oportunidades</text>

  <text x="148" y="272" class="sans" font-size="13" fill="#64748b">NEXUS · Ponto de conexão entre o problema e a solução</text>

  <!-- Chamado -->
  <rect x="690" y="34" width="268" height="232" rx="16" fill="#0f172a" stroke="#334155"/>
  <circle cx="712" cy="53" r="4" fill="#334155"/>
  <circle cx="726" cy="53" r="4" fill="#334155"/>
  <circle cx="740" cy="53" r="4" fill="#334155"/>
  <text x="944" y="57" text-anchor="end" class="mono" font-size="12" fill="#94a3b8">chamado NX-000001</text>
  <line x1="690" y1="70" x2="958" y2="70" stroke="#334155" stroke-dasharray="4 4"/>

  <g class="mono" font-size="12">
    <text x="708" y="96" fill="#64748b">Solicitante</text>
    <text x="800" y="96" fill="#e2e8f0">Recrutador(a)</text>
    <text x="708" y="120" fill="#64748b">Assunto</text>
    <text x="800" y="120" fill="#e2e8f0">Vaga Help Desk N1</text>
    <text x="708" y="144" fill="#64748b">Responsável</text>
    <text x="800" y="144" fill="#e2e8f0">Guilherme M. O.</text>
  </g>

  <!-- Etapas (base apagada) -->
  <g class="mono" font-size="11" text-anchor="middle">
    <rect x="708" y="162" width="72" height="30" rx="8" fill="none" stroke="#334155" stroke-dasharray="4 3"/>
    <rect x="788" y="162" width="72" height="30" rx="8" fill="none" stroke="#334155" stroke-dasharray="4 3"/>
    <rect x="868" y="162" width="72" height="30" rx="8" fill="none" stroke="#334155" stroke-dasharray="4 3"/>
    <text x="744" y="181" fill="#64748b">Aberto</text>
    <text x="824" y="181" fill="#64748b">Andamento</text>
    <text x="904" y="181" fill="#64748b">Fechado</text>
  </g>

  <!-- Etapas acendendo -->
  <g class="s s1">
    <rect x="708" y="162" width="72" height="30" rx="8" fill="#0f172a"/>
    <rect x="708" y="162" width="72" height="30" rx="8" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24"/>
    <text x="744" y="181" class="mono" font-size="11" text-anchor="middle" fill="#fbbf24">Aberto</text>
  </g>
  <g class="s s2">
    <rect x="788" y="162" width="72" height="30" rx="8" fill="#0f172a"/>
    <rect x="788" y="162" width="72" height="30" rx="8" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa"/>
    <text x="824" y="181" class="mono" font-size="11" text-anchor="middle" fill="#60a5fa">Andamento</text>
  </g>
  <g class="s s3">
    <rect x="868" y="162" width="72" height="30" rx="8" fill="#0f172a"/>
    <rect x="868" y="162" width="72" height="30" rx="8" fill="#34d399" fill-opacity="0.14" stroke="#34d399"/>
    <text x="904" y="181" class="mono" font-size="11" text-anchor="middle" fill="#34d399">Fechado</text>
  </g>

  <g class="s ok">
    <text x="708" y="226" class="sans" font-size="14" font-weight="700" fill="#34d399">&#10003; Chamado fechado!</text>
    <text x="708" y="247" class="sans" font-size="12" fill="#94a3b8">Solução: falar com o Guilherme</text>
  </g>
</svg>
